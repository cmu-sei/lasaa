# ---- Network ----
bind 127.0.0.1
port 7379
tcp-backlog 128
# Close connections idle for this many seconds (0 = never).  [runtime]
timeout 0
# [runtime]
maxclients 1000

# ---- Memory ----
# Upper bound on memory used by keys and values (0 = unlimited).  Sizes accept
# k, m, and g suffixes (powers of 1024).  [runtime]
maxmemory 256mb
# What to do when maxmemory is reached: noeviction, allkeys-lru, or
# volatile-ttl.  [runtime]
maxmemory-policy allkeys-lru
# Keys sampled per eviction; more samples approximate LRU better.  [runtime]
maxmemory-samples 5

# ---- Persistence ----
dir "./data"
dbfilename dump.tkv
# Snapshot every save-interval seconds if at least save-min-changes keys
# changed (save-interval 0 disables periodic snapshots).  [runtime]
save-interval 300
save-min-changes 1

appendonly no
appendfilename appendonly.aof
# no, everysec, or always.  [runtime]
appendfsync everysec

# ---- Logging ----
# Empty logfile = stderr.
logfile ""
# debug, info, warn, or error.  [runtime]
loglevel info

# ---- Security ----
# Require clients to AUTH with this password.  [runtime]
# requirepass "change me"

# ---- Protocol limits ----  [runtime]
max-request-bytes 64mb
proto-max-bulk-len 16mb
max-args 65536

# Site-specific overrides can live in a separate file:
# include local.conf
